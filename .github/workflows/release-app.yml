name: Build desktop app

# Builds standalone downloadable binaries of the glia shell for Windows, macOS,
# and Linux with PyInstaller. Runs on every published release (attaching the
# binaries to it) and on manual dispatch (as workflow artifacts you can test).
#
# The binaries run in browser mode (the server is pure stdlib, so no native GUI
# backend is bundled — rock-solid across platforms). `pip install glia-agents[shell]`
# is the path to the native window via pywebview.
#
# The matrix jobs only upload artifacts; a single `attach` job then adds them to
# the release in one call — so concurrent uploads can't race and drop an asset.
# That job also writes SHA256SUMS and signs a build-provenance attestation, so a
# downloaded executable can be checked rather than trusted.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: glia-shell-windows.exe
            bin: dist/glia-shell.exe
          - os: macos-latest
            asset: glia-shell-macos
            bin: dist/glia-shell
          - os: ubuntu-latest
            asset: glia-shell-linux
            bin: dist/glia-shell
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip pyinstaller
          pip install ".[anthropic]"

      - name: Build binary
        run: >
          pyinstaller --onefile --name glia-shell
          --collect-data glia.shell
          --collect-submodules glia
          --collect-all anthropic
          glia/shell/__main__.py

      - name: Smoke test (binary launches)
        shell: bash
        run: "${{ matrix.bin }} --help"

      - name: Rename asset
        shell: bash
        run: cp "${{ matrix.bin }}" "${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  attach:
    # One job attaches every binary at once, so concurrent uploads can't drop one.
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signing the provenance statement needs an OIDC token, and writing the
      # attestation needs its own scope. Both are job-scoped rather than
      # top-level so the matrix builds keep read-only credentials.
      id-token: write
      attestations: write
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: bins
          merge-multiple: true

      # A downloader who wants to check what they got needs something to check
      # against. One file, the format sha256sum -c reads directly.
      - name: Checksums
        working-directory: bins
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Signed provenance: which workflow, at which commit, produced these exact
      # bytes. Verifiable with `gh attestation verify <file> --repo
      # DrobyshevDev/glia` without trusting this release page.
      - name: Attest the binaries
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            bins/glia-shell-windows.exe
            bins/glia-shell-macos
            bins/glia-shell-linux

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: bins/*
