name: Publish to PyPI

# Publishes to PyPI via Trusted Publishing (OIDC) — no API token needed.
# Configure the trusted publisher once on PyPI:
#   https://pypi.org/manage/account/publishing/
#   Project: glia-agents | Owner: DrobyshevDev | Repo: glia | Workflow: publish.yml
# Then publishing runs automatically whenever a GitHub Release is published
# (or manually via the "Run workflow" button / workflow_dispatch).

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # trusted publishing (OIDC)
      attestations: write   # build provenance for the built distributions
      contents: write       # attach those distributions to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

      # The release page linked from the README carried the desktop-app bundles
      # and not the wheel anyone actually installs, so there was nothing there
      # tying a downloaded distribution to the run that built it.
      #
      # attest-build-provenance signs a SLSA statement naming this repository,
      # this workflow and this commit as the builder; verify a file against it
      # with
      #
      #   gh attestation verify <file> --repo DrobyshevDev/glia
      #
      # PyPI-side PEP 740 attestations are unchanged: gh-action-pypi-publish
      # produces those by default under Trusted Publishing.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "dist/*"

      - name: Attach the distributions to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
