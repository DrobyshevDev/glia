version: 2

updates:
  # Actions first: a stale third-party action is a supply-chain risk in every
  # workflow that uses it, and the bump is almost always safe to take.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps"
    groups:
      dev-tooling:
        patterns: ["ruff", "mypy", "pytest*", "pre-commit", "build", "twine"]
        dependency-type: development
      docs:
        patterns: ["mkdocs*"]
    # The core has zero required dependencies and every provider lives behind an
    # extra. There is nothing here Dependabot can bump that a user is forced to
    # install, which is why the limit is low: the queue should stay short enough
    # to read.
    open-pull-requests-limit: 5
