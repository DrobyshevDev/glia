<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <style>
    /* Elements default to visible (the final frame), so the image still reads as a
       full screenshot if a viewer's browser doesn't run SVG animations. */
    .a { animation: 9s infinite; }
    .t1{animation-name:k1} .t2{animation-name:k2} .t3{animation-name:k3} .t4{animation-name:k4}
    .t5{animation-name:k5} .t6{animation-name:k6} .t7{animation-name:k7} .t8{animation-name:k8}
    @keyframes k1{0%,6%{opacity:0}8%,100%{opacity:1}}
    @keyframes k2{0%,14%{opacity:0}16%,100%{opacity:1}}
    @keyframes k3{0%,22%{opacity:0}24%,100%{opacity:1}}
    @keyframes k4{0%,31%{opacity:0}33%,100%{opacity:1}}
    @keyframes k5{0%,41%{opacity:0}43%,100%{opacity:1}}
    @keyframes k6{0%,50%{opacity:0}52%,100%{opacity:1}}
    @keyframes k7{0%,58%{opacity:0}60%,100%{opacity:1}}
    @keyframes k8{0%,78%{opacity:0}80%,100%{opacity:1}}
    .cursor{animation:blink .9s steps(2) infinite}
    @keyframes blink{50%{opacity:0}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.4}}
  </style>
  <defs><clipPath id="win"><rect x="20" y="20" width="1160" height="650" rx="14"/></clipPath></defs>
  <rect width="1200" height="690" fill="#e9e7e1"/>
  <g clip-path="url(#win)">
    <rect x="20" y="20" width="1160" height="650" fill="#f7f6f3"/>

    <!-- sidebar -->
    <rect x="20" y="20" width="230" height="650" fill="#f2f1ec"/>
    <line x1="250" y1="20" x2="250" y2="670" stroke="#e7e4dd"/>
    <g transform="translate(40,42) scale(0.6)" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M16 3.6 L26.8 9.8 L26.8 22.2 L16 28.4 L5.2 22.2 L5.2 9.8 Z"/><path d="M16 16 L5.2 9.8 M16 16 L26.8 9.8 M16 16 L16 28.4"/></g>
    <text x="70" y="58" font-size="16" font-weight="650" fill="#232620">glia</text>
    <rect x="40" y="78" width="190" height="36" rx="9" fill="#fff" stroke="#e7e4dd"/>
    <text x="135" y="101" font-size="13.5" font-weight="600" fill="#4c4f47" text-anchor="middle">New chat</text>
    <rect class="a t1" x="34" y="128" width="202" height="34" rx="9" fill="#fff"/>
    <text class="a t1" x="48" y="150" font-size="13.5" fill="#232620">Weather in Paris?</text>
    <text x="48" y="188" font-size="13.5" fill="#85867b">Summarise this doc</text>
    <text x="48" y="222" font-size="13.5" fill="#85867b">Refactor my parser</text>
    <line x1="20" y1="628" x2="250" y2="628" stroke="#e7e4dd"/>
    <text x="42" y="653" font-size="12.5" fill="#85867b">Settings</text>
    <text x="125" y="653" font-size="12.5" fill="#85867b">Theme</text>

    <!-- topbar -->
    <rect x="250" y="20" width="930" height="52" fill="#fff"/>
    <line x1="250" y1="72" x2="1180" y2="72" stroke="#e7e4dd"/>
    <text x="274" y="52" font-size="15" font-weight="600" fill="#232620">Weather in Paris?</text>
    <rect x="470" y="36" width="58" height="21" rx="10" fill="#0d9488"/>
    <text x="499" y="51" font-size="11.5" fill="#fff" text-anchor="middle">Claude</text>
    <text x="1120" y="52" font-size="13" fill="#85867b" text-anchor="end">Glass box</text>

    <!-- chat -->
    <g class="a t1">
      <circle cx="770" cy="118" r="15" fill="#eef1ea"/>
      <text x="770" y="123" font-size="10" fill="#4c4f47" text-anchor="middle">you</text>
      <rect x="470" y="102" width="280" height="34" rx="14" fill="#0d9488"/>
      <text x="490" y="124" font-size="14" fill="#fff">What's the weather in Paris?</text>
    </g>
    <g class="a t7">
      <circle cx="288" cy="182" r="15" fill="#d7efec" stroke="#e7e4dd"/>
      <g transform="translate(280,174) scale(0.5)" fill="none" stroke="#0d9488" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"><path d="M16 3.6 L26.8 9.8 L26.8 22.2 L16 28.4 L5.2 22.2 L5.2 9.8 Z"/><path d="M16 16 L5.2 9.8 M16 16 L26.8 9.8 M16 16 L16 28.4"/></g>
      <text x="314" y="172" font-size="12" font-weight="650" fill="#85867b">glia</text>
      <text x="314" y="194" font-size="14.5" fill="#232620">It's <tspan font-weight="700">18°C</tspan> and cloudy in Paris.<tspan class="cursor" fill="#0d9488">▋</tspan></text>
    </g>

    <!-- composer -->
    <line x1="250" y1="612" x2="1180" y2="612" stroke="#e7e4dd"/>
    <rect x="290" y="628" width="620" height="40" rx="15" fill="#f7f6f3" stroke="#e7e4dd"/>
    <text x="308" y="653" font-size="13.5" fill="#a6a79c">Message glia…</text>
    <rect x="838" y="633" width="66" height="30" rx="10" fill="#0d9488"/>
    <text x="871" y="653" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">Send</text>

    <!-- glass box drawer -->
    <rect x="900" y="72" width="280" height="598" fill="#0f1513"/>
    <line x1="900" y1="72" x2="900" y2="670" stroke="#e7e4dd"/>
    <circle class="pulse" cx="922" cy="102" r="3.5" fill="#2dd4bf"/>
    <text x="936" y="106" font-size="10.5" letter-spacing="1.2" fill="#9fc9c2" opacity=".7">GLASS BOX</text>
    <line x1="900" y1="120" x2="1180" y2="120" stroke="rgba(255,255,255,.07)"/>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5">
      <text class="a t2" x="920" y="150" fill="#8aa6a1">• run_started</text>
      <text class="a t3" x="920" y="176" fill="#cfe6e2">• model_call · 1</text>
      <text class="a t4" x="920" y="202" fill="#7dd3fc">• tool_called</text>
      <text class="a t4" x="933" y="220" fill="#7dd3fc" opacity=".85">get_weather(city)</text>
      <text class="a t5" x="920" y="248" fill="#86efac">• tool_returned</text>
      <text class="a t5" x="933" y="266" fill="#86efac" opacity=".85">"18°C, cloudy"</text>
      <text class="a t6" x="920" y="294" fill="#cfe6e2">• model_call · 2</text>
      <text class="a t8" x="920" y="320" fill="#8aa6a1">• run_finished</text>
    </g>
  </g>
  <rect x="20.5" y="20.5" width="1159" height="649" rx="14" fill="none" stroke="#dcdad3"/>
</svg>
